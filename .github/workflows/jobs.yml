name: Pipeline GameHub

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Estágio de Verificações e Qualidade do Código
  verificar-site:
    name: Verificações de Qualidade e Estrutura
    runs-on: ubuntu-latest
    steps:
      - name: Download do código
        uses: actions/checkout@v4

      - name: Verificar se o index.html existe
        run: test -f index.html

      - name: Verificar se o styles.css existe
        run: test -f styles.css

      - name: Verificar título no HTML
        run: grep -q "<title>" index.html

      - name: Verificar parágrafo no HTML
        run: grep -q "<p>" index.html

      - name: Verificar tamanho dos arquivos
        run: |
          ls -lh index.html styles.css

  # 2. Estágio de SAST (Análise Estática de Segurança com Semgrep)
  sast:
    name: Análise SAST (Semgrep)
    needs: verificar-site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Executar Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: auto

  # 3. Estágio de Deploy (Publica o site estático no GitHub Pages)
  deploy:
    name: Deploy para Produção
    needs: [verificar-site, sast]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Enviar artefatos para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 4. Estágio de DAST (Análise Dinâmica na aplicação já publicada)
  dast:
    name: Análise DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Executar OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: '${{ steps.deployment.outputs.page_url }}'