name: Pipeline Gamehub

on:
  push:
    branches:
      - main

jobs:
  verificar-site:
    runs-on: ubuntu-latest

    steps:
      - name: Download do código
        uses: actions/checkout@v4

      - name: Verificar Arquivo HTML
        run: test -f index.html

      - name: Verificar título
        run: grep -q "<title>" index.html

      - name: Verificar parágrafo
        run: grep -q "<p>" index.html